<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Value Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  .heading {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  .heading h1 {
    margin: 0;
    flex-shrink: 0;
    font-family: "Oswald", "Arial Narrow", Impact, sans-serif;
    font-weight: 600;
    font-size: clamp(20px, 3.2vw, 44px);
    line-height: 1.1;
    color: #4B5656;
    white-space: nowrap;
  }

  /* Hai đường kẻ bo tròn đầu (round cap) */
  .line {
    flex: 1 1 0;
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(
      90deg,
      #395BE7 7%,
      #E55557 53%,
      #E9AE4D 98%
    );
    /* Gradient chạy liền mạch từ trái sang phải trên toàn banner */
    background-attachment: fixed;
  }
</style>
</head>
<body>
  <div class="heading">
    <div class="line"></div>
    <h1>Everyday Value Menu</h1>
    <div class="line"></div>
  </div>
</body>
</html>
